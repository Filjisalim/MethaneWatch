; MethaneWatch – Firmware Node
; ==============================
; Prototipe awal. Belum diuji di lapangan.
; Semua nilai teknis adalah asumsi sampai diverifikasi ke datasheet.
;
; CATATAN KESELAMATAN:
;   Jangan memasang perangkat di TPA tanpa izin pengelola, pendamping
;   berpengalaman, dan penilaian keselamatan ahli.

[platformio]
default_envs = esp32_sim

; ---------------------------------------------------------------
; Lingkungan SIMULASI (tidak memerlukan hardware) – untuk pengujian
; ---------------------------------------------------------------
[env:esp32_sim]
platform      = espressif32
board         = esp32dev
framework     = arduino
build_flags   =
    -D SIM_MODE=1
    -D NODE_ID=1
    -D LORA_FREQ_HZ=923000000
    ; Frekuensi LoRa [Verifikasi: cek alokasi frekuensi ISM Indonesia di SDPPI/Kominfo]
    ; Opsi umum di Indonesia: 915 MHz atau 923 MHz [Verifikasi]
test_build_src = yes

; ---------------------------------------------------------------
; Lingkungan HARDWARE NYATA (butuh hardware terpasang)
; ---------------------------------------------------------------
[env:esp32_hw]
platform      = espressif32
board         = esp32dev
framework     = arduino
build_flags   =
    -D SIM_MODE=0
    -D NODE_ID=1
    -D LORA_FREQ_HZ=923000000
    ; [Verifikasi: konfirmasi frekuensi dengan regulator]

; ---------------------------------------------------------------
; Lingkungan NATIVE TEST (uji unit C++ di PC, tanpa hardware)
; ---------------------------------------------------------------
[env:native_test]
platform   = native
test_build_src = yes
build_flags =
    -D SIM_MODE=1
    -D NODE_ID=99
    -D LORA_FREQ_HZ=923000000
    -D NATIVE_TEST=1
