; MethaneWatch – Firmware Gateway
; ==================================
; Prototipe awal. Belum diuji di lapangan.
;
; Gateway menerima paket LoRa dari node, memvalidasi CRC,
; menyimpan ke SQLite/CSV (offline-first), dan meneruskan ke MQTT
; jika koneksi tersedia.
;
; Dua opsi hardware didukung:
;   1. esp32_gw: ESP32 + modul LoRa SX127x (hemat biaya)
;   2. rpi_stub:  Raspberry Pi (Python di /gateway/rpi/, dikompilasi di sini hanya untuk dokumentasi)
;
; Untuk Raspberry Pi: gunakan skrip Python di folder /gateway/rpi/ langsung.
; Platform PlatformIO tidak diperlukan untuk RPi; ini hanya untuk ESP32.

[platformio]
default_envs = esp32_gw_sim

; ---------------------------------------------------------------
; Gateway ESP32 – Mode Simulasi
; ---------------------------------------------------------------
[env:esp32_gw_sim]
platform    = espressif32
board       = esp32dev
framework   = arduino
build_flags =
    -D SIM_MODE=1
    -D GATEWAY_ID=100
    -D LORA_FREQ_HZ=923000000
    ; [Verifikasi frekuensi]

; ---------------------------------------------------------------
; Gateway ESP32 – Hardware Nyata
; ---------------------------------------------------------------
[env:esp32_gw_hw]
platform    = espressif32
board       = esp32dev
framework   = arduino
build_flags =
    -D SIM_MODE=0
    -D GATEWAY_ID=100
    -D LORA_FREQ_HZ=923000000
